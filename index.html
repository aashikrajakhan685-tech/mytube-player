
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>MyTube Premium Player</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #090912;
      color: white;
      font-family: Arial, sans-serif;
    }

    h2 {
      text-align: center;
      color: #00e5ff;
    }

    .player {
      width: 100%;
      aspect-ratio: 16 / 9;
      border: 2px solid #bd4cff;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 0 18px #bd4cff66;
      background: black;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    input, button {
      width: 100%;
      padding: 13px;
      margin-top: 14px;
      border-radius: 10px;
      font-size: 16px;
    }

    input {
      background: #171728;
      color: white;
      border: 1px solid #555;
    }

    button {
      background: linear-gradient(
        90deg, #00e5ff, #b44cff
      );
      color: #080812;
      border: none;
      font-weight: bold;
    }

    #status {
      color: #aaa;
      text-align: center;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <h2>MyTube Premium</h2>

  <div class="player">
    <iframe
      id="videoPlayer"
      title="YouTube video player"
      src="https://www.youtube.com/embed/jfKfPfyJRdk"
      allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture; fullscreen"
      referrerpolicy="strict-origin-when-cross-origin"
      allowfullscreen>
    </iframe>
  </div>

  <input
    id="videoId"
    type="text"
    placeholder="Enter YouTube video ID"
  >

  <button onclick="loadVideo()">
    Play Video
  </button>

  <p id="status">Ready to play</p>

  <script>
    function loadVideo() {
      const input = document.getElementById("videoId");
      const status = document.getElementById("status");
      const videoId = input.value.trim();

      if (!/^[a-zA-Z0-9_-]{11}$/.test(videoId)) {
        status.textContent = "Enter a valid YouTube video ID.";
        return;
      }

      const player = document.getElementById("videoPlayer");
      player.src =
        "https://www.youtube.com/embed/" +
        encodeURIComponent(videoId);

      status.textContent = "Loading video...";
    }
  </script>
</body>
</html>
