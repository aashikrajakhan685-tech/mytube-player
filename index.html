
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <meta name="referrer"
        content="strict-origin-when-cross-origin">

  <title>MyTube Premium Player</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 16px;
      background: #090912;
      color: white;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    h1 {
      color: #00e5ff;
      text-align: center;
      font-size: clamp(26px, 7vw, 42px);
      margin: 24px 0 30px;
    }

    .player {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      border: 2px solid #bd4cff;
      border-radius: 18px;
      overflow: hidden;
      background: black;
      box-shadow: 0 0 20px #bd4cff66;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: none;
    }

    .player:fullscreen {
      width: 100vw;
      height: 100vh;
      aspect-ratio: auto;
      border: none;
      border-radius: 0;
      box-shadow: none;
      background: black;
    }

    .player:fullscreen iframe {
      width: 100%;
      height: 100%;
    }

    input,
    button {
      width: 100%;
      padding: 15px;
      margin-top: 16px;
      border-radius: 12px;
      font-size: 16px;
    }

    input {
      background: #171728;
      color: white;
      border: 1px solid #666;
      outline: none;
    }

    input:focus {
      border-color: #00e5ff;
    }

    button {
      border: none;
      background: linear-gradient(
        90deg,
        #00e5ff,
        #b44cff
      );
      color: #090912;
      font-weight: bold;
      cursor: pointer;
    }

    .fullscreen-btn {
      background: #24243a;
      color: white;
      border: 1px solid #bd4cff;
    }

    .exit-btn {
      display: none;
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 10;
      width: auto;
      margin: 0;
      padding: 10px 14px;
      background: #171728dd;
      color: white;
      border: 1px solid #00e5ff;
    }

    .player:fullscreen .exit-btn {
      display: block;
    }

    #status {
      text-align: center;
      color: #b5b5c5;
      font-size: 14px;
      margin-top: 20px;
    }

    .hint {
      color: #85859b;
      text-align: center;
      font-size: 12px;
      margin-top: 12px;
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>MyTube Premium</h1>

    <div class="player" id="playerContainer">
      <iframe
        id="videoPlayer"
        title="YouTube video player"
        src="https://www.youtube.com/embed/jNQXAC9IVRw?playsinline=1"
        allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture; fullscreen"
        referrerpolicy="strict-origin-when-cross-origin"
        allowfullscreen>
      </iframe>

      <button
        class="exit-btn"
        onclick="exitFullscreen()">
        Exit Fullscreen
      </button>
    </div>

    <input
      id="videoId"
      type="text"
      maxlength="11"
      placeholder="Enter YouTube video ID"
      aria-label="YouTube video ID"
    >

    <button onclick="loadVideo()">
      Play Video
    </button>

    <button
      class="fullscreen-btn"
      onclick="openFullscreen()">
      Fullscreen Video
    </button>

    <p id="status" role="status">
      Ready to play
    </p>

    <p class="hint">
      Playback availability depends on YouTube.
    </p>
  </main>

  <script>
    "use strict";

    const playerContainer =
      document.getElementById("playerContainer");

    const videoPlayer =
      document.getElementById("videoPlayer");

    const videoInput =
      document.getElementById("videoId");

    const statusElement =
      document.getElementById("status");

    function setStatus(message) {
      statusElement.textContent = message;
    }

    function loadVideo() {
      const videoId = videoInput.value.trim();

      if (!/^[a-zA-Z0-9_-]{11}$/.test(videoId)) {
        setStatus("Enter a valid 11-character video ID.");
        return;
      }

      const videoUrl =
        "https://www.youtube.com/embed/" +
        encodeURIComponent(videoId) +
        "?playsinline=1";

      videoPlayer.src = videoUrl;

      setStatus("Player opened. Tap Play inside the video.");
    }
function loadVideoFromUrl() {
  const params = new URLSearchParams(window.location.search);
  const videoId = params.get("v");

  if (videoId && /^[a-zA-Z0-9_-]{11}$/.test(videoId)) {
    videoInput.value = videoId;
    loadVideo();
  }
}

window.addEventListener("load", loadVideoFromUrl);
    async function openFullscreen() {
      try {
        if (document.fullscreenElement) {
          return;
        }

        if (!playerContainer.requestFullscreen) {
          setStatus(
            "Fullscreen is not supported in this browser."
          );
          return;
        }

        await playerContainer.requestFullscreen();

        setStatus("Fullscreen enabled.");
      } catch (error) {
        console.error("Fullscreen error:", error);
        setStatus(
          "Fullscreen failed. Try opening in Chrome."
        );
      }
    }

    async function exitFullscreen() {
      try {
        if (document.fullscreenElement) {
          await document.exitFullscreen();
        }
      } catch (error) {
        console.error("Exit fullscreen error:", error);
        setStatus("Unable to exit fullscreen.");
      }
    }

    document.addEventListener(
      "fullscreenchange",
      function () {
        if (!document.fullscreenElement) {
          setStatus("Fullscreen closed.");
        }
      }
    );
  </script>
</body>
</html>
