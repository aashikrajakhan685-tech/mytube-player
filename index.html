
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <meta name="referrer"
        content="strict-origin-when-cross-origin">
  <title>MyTube Premium Player</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 16px;
      background: #090912;
      color: white;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    h1 {
      color: #00e5ff;
      text-align: center;
      font-size: clamp(26px, 7vw, 42px);
      margin: 24px 0 30px;
    }

    .player {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      border: 2px solid #bd4cff;
      border-radius: 18px;
      overflow: hidden;
      background: black;
      box-shadow: 0 0 20px #bd4cff66;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: none;
    }

    .player:fullscreen {
      width: 100vw;
      height: 100vh;
      aspect-ratio: auto;
      border: none;
      border-radius: 0;
    }

    input, button {
      width: 100%;
      padding: 15px;
      margin-top: 16px;
      border-radius: 12px;
      font-size: 16px;
    }

    input {
      background: #171728;
      color: white;
      border: 1px solid #666;
    }

    button {
      border: none;
      background: linear-gradient(
        90deg, #00e5ff, #b44cff
      );
      color: #090912;
      font-weight: bold;
    }

    .fullscreen-btn {
      background: #24243a;
      color: white;
      border: 1px solid #bd4cff;
    }

    #status {
      text-align: center;
      color: #b5b5c5;
      font-size: 14px;
      margin-top: 20px;
    }

    .hint {
      color: #85859b;
      text-align: center;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>MyTube Premium</h1>

    <div class="player" id="playerContainer">
      <iframe
        id="videoPlayer"
        title="YouTube video player"
        allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture; fullscreen"
        referrerpolicy="strict-origin-when-cross-origin"
        allowfullscreen>
      </iframe>
    </div>

    <input
      id="videoId"
      type="text"
      maxlength="11"
      placeholder="Enter YouTube video ID"
      aria-label="YouTube video ID">

    <button id="playButton">
      Play Video
    </button>

    <button
      class="fullscreen-btn"
      id="fullscreenButton">
      Fullscreen Video
    </button>

    <p id="status" role="status">
      Ready to play
    </p>

    <p class="hint">
      Playback availability depends on YouTube.
    </p>
  </main>

  <script>
    "use strict";

    const playerContainer =
      document.getElementById("playerContainer");

    const videoPlayer =
      document.getElementById("videoPlayer");

    const videoInput =
      document.getElementById("videoId");

    const statusElement =
      document.getElementById("status");

    const validId = /^[a-zA-Z0-9_-]{11}$/;

    function setStatus(message) {
      statusElement.textContent = message;
    }

    function loadVideo(videoId) {
      const id = videoId.trim();

      if (!validId.test(id)) {
        setStatus("Enter a valid 11-character video ID.");
        return;
      }

      videoInput.value = id;

      const embedUrl =
        "https://www.youtube.com/embed/" +
        encodeURIComponent(id) +
        "?playsinline=1";

      videoPlayer.src = embedUrl;

      setStatus("Tap Play inside the video.");
    }

    function loadVideoFromUrl() {
      const params =
        new URLSearchParams(window.location.search);

      const id = params.get("v");

      if (id) {
        loadVideo(id);
      } else {
        setStatus("Select a video to start playback.");
      }
    }

    document.getElementById("playButton")
      .addEventListener("click", function () {
        loadVideo(videoInput.value);
      });

    document.getElementById("fullscreenButton")
      .addEventListener("click", async function () {
        try {
          if (document.fullscreenElement) {
            return;
          }

          if (!playerContainer.requestFullscreen) {
            setStatus("Fullscreen not supported.");
            return;
          }

          await playerContainer.requestFullscreen();
        } catch (error) {
          console.error(error);
          setStatus("Fullscreen failed.");
        }
      });

    loadVideoFromUrl();
  </script>
</body>
</html>
